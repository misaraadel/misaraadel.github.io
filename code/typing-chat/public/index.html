<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شات «بيكتب…»</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b141a; color: #e9edef; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; }
  header { background: #202c33; padding: 14px 18px; }
  header b { display: block; font-size: 17px; }
  #status { font-size: 13px; color: #8696a0; min-height: 18px; }
  #status.typing { color: #25d366; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 75%; padding: 8px 12px; border-radius: 10px; line-height: 1.5; }
  .m small { display: block; font-size: 11px; color: #8696a0; }
  .me { align-self: flex-start; background: #005c4b; }
  .them { align-self: flex-end; background: #202c33; }
  form { display: flex; gap: 8px; padding: 10px; background: #202c33; }
  input { flex: 1; border: 0; border-radius: 22px; padding: 12px 16px; background: #2a3942; color: #e9edef; font-size: 15px; outline: none; }
  button { border: 0; border-radius: 50%; width: 46px; background: #00a884; color: #fff; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header><b>💬 جروب الشات</b><span id="status">متصل</span></header>
  <div id="msgs"></div>
  <form id="f"><input id="t" placeholder="اكتب رسالة…" autocomplete="off"><button>➤</button></form>
</div>
<script>
  const name = prompt('اسمك إيه؟') || 'مجهول';
  // خط واحد مفتوح مع السيرفر (wss لو الموقع https)
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  const $ = (id) => document.getElementById(id);
  const typers = new Map(); // مين بيكتب دلوقتي

  function showStatus() {
    const names = [...typers.keys()];
    $('status').textContent = names.length ? `${names.join('، ')} بيكتب…` : 'متصل';
    $('status').className = names.length ? 'typing' : '';
  }
  function add(text, who, mine) {
    const d = document.createElement('div');
    d.className = 'm ' + (mine ? 'me' : 'them');
    d.innerHTML = mine ? '' : `<small></small>`;
    if (!mine) d.firstChild.textContent = who;
    d.append(text);
    $('msgs').append(d); $('msgs').scrollTop = 1e9;
  }

  // السيرفر هو اللي بيبعتلنا أول ما حاجة تحصل (مفيش polling)
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'typing') {
      clearTimeout(typers.get(data.name));
      if (data.on) typers.set(data.name, setTimeout(() => { typers.delete(data.name); showStatus(); }, 3000));
      else typers.delete(data.name);
      showStatus();
    }
    if (data.type === 'message') { typers.delete(data.name); showStatus(); add(data.text, data.name, false); }
  };

  // «بيكتب…»: نبعت مرة لما يبدأ، ومرة لما يقف ثانيتين
  let typing = false, stopTimer;
  $('t').addEventListener('input', () => {
    if (!typing) { typing = true; ws.send(JSON.stringify({ type: 'typing', name, on: true })); }
    clearTimeout(stopTimer);
    stopTimer = setTimeout(() => { typing = false; ws.send(JSON.stringify({ type: 'typing', name, on: false })); }, 2000);
  });

  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('t').value.trim();
    if (!text) return;
    ws.send(JSON.stringify({ type: 'message', name, text }));
    add(text, name, true);
    $('t').value = ''; typing = false; clearTimeout(stopTimer);
  });
</script>
</body>
</html>
